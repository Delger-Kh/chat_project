<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCP Chat — Багийн ажил №7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #161b22;
    --bg3: #1c2230;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --accent: #4f8ef7;
    --accent2: #3d7de8;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --bubble-me: #1a3a6b;
    --bubble-other: #1c2230;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --radius: 12px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Login overlay ── */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 18px;
    padding: 40px 48px;
    width: 360px;
    display: flex; flex-direction: column; gap: 20px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .login-box h1 {
    font-family: var(--mono);
    font-size: 22px; font-weight: 600;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .login-box h1 span { color: var(--accent); }
  .login-box p { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .login-box label { font-size: 12px; color: var(--text2); letter-spacing: .04em; text-transform: uppercase; }
  .login-box input {
    width: 100%; padding: 11px 14px;
    background: var(--bg3); color: var(--text);
    border: 1px solid var(--border2); border-radius: 8px;
    font-family: var(--mono); font-size: 14px;
    outline: none; transition: border-color .2s;
    margin-top: 6px;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    padding: 12px; border-radius: 8px;
    background: var(--accent); color: #fff;
    border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .1s;
    font-family: var(--sans);
  }
  .login-box button:hover { background: var(--accent2); }
  .login-box button:active { transform: scale(.98); }
  .login-status {
    font-size: 12px; padding: 8px 12px;
    border-radius: 6px; display: none;
  }
  .login-status.error { background: rgba(248,81,73,.12); color: var(--red); display: block; }
  .login-status.info  { background: rgba(79,142,247,.12); color: var(--accent); display: block; }

  /* ── Layout ── */
  #sidebar {
    width: 240px; min-width: 240px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 {
    font-family: var(--mono); font-size: 13px;
    font-weight: 600; color: var(--text);
    letter-spacing: .02em;
  }
  .server-status {
    display: flex; align-items: center; gap: 7px;
    margin-top: 6px; font-size: 11px; color: var(--text2);
    font-family: var(--mono);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); flex-shrink: 0;
    transition: background .3s;
  }
  .status-dot.on { background: var(--green); animation: glow 2s infinite; }
  @keyframes glow { 0%,100%{opacity:1} 50%{opacity:.5} }

  .online-section {
    padding: 12px 16px 8px;
    font-size: 10px; font-weight: 600;
    color: var(--text3); letter-spacing: .1em; text-transform: uppercase;
  }
  #online-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .user-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 8px;
    font-size: 13px; color: var(--text2);
    transition: background .15s;
  }
  .user-item:hover { background: var(--bg3); }
  .user-item.me { color: var(--accent); }
  .user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
    font-family: var(--mono);
  }
  .online-badge {
    margin-left: auto; font-size: 10px;
    color: var(--green); font-family: var(--mono);
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text3);
    font-family: var(--mono);
  }

  /* ── Main chat ── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg2);
  }
  .chat-header-left { display: flex; flex-direction: column; gap: 3px; }
  .chat-header-left h3 {
    font-family: var(--mono); font-size: 14px;
    font-weight: 600; color: var(--text);
  }
  .chat-header-left span { font-size: 11px; color: var(--text2); }
  .msg-count {
    font-family: var(--mono); font-size: 11px;
    color: var(--text3); background: var(--bg3);
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border);
  }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-row {
    display: flex; flex-direction: column;
    max-width: 68%; animation: fadeUp .18s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; }

  .msg-meta {
    font-size: 10px; color: var(--text3);
    font-family: var(--mono); padding: 0 4px;
    margin-bottom: 3px;
  }
  .msg-bubble {
    padding: 9px 14px;
    border-radius: 14px; font-size: 13.5px; line-height: 1.55;
    font-family: var(--sans); word-break: break-word;
  }
  .msg-row.me .msg-bubble {
    background: var(--bubble-me);
    color: #c9d8f5;
    border-bottom-right-radius: 4px;
    border: 1px solid rgba(79,142,247,.2);
  }
  .msg-row.other .msg-bubble {
    background: var(--bubble-other);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .msg-time {
    font-size: 10px; color: var(--text3);
    font-family: var(--mono); padding: 2px 4px 0;
  }

  .sys-row {
    align-self: center;
    font-size: 11px; color: var(--text3);
    font-family: var(--mono);
    background: var(--bg3);
    padding: 3px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    margin: 4px 0;
  }

  /* ── Input area ── */
  .input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    display: flex; gap: 10px; align-items: flex-end;
  }
  #msg-input {
    flex: 1; padding: 11px 16px;
    background: var(--bg3); color: var(--text);
    border: 1px solid var(--border2); border-radius: 10px;
    font-family: var(--sans); font-size: 14px;
    outline: none; resize: none; min-height: 44px; max-height: 120px;
    transition: border-color .2s; line-height: 1.5;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text3); }
  #send-btn {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: background .15s, transform .1s;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:active { transform: scale(.95); }
  #send-btn svg { width: 18px; height: 18px; fill: white; }
  #send-btn:disabled { background: var(--bg3); cursor: not-allowed; }
  #send-btn:disabled svg { fill: var(--text3); }

  .typing-hint {
    font-size: 11px; color: var(--text3);
    font-family: var(--mono); padding: 0 4px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
  <div class="login-box">
    <h1>TCP <span>Chat</span></h1>
    <p>Багийн ажил №7 — WebSocket + OOP<br>Серверт холбогдохын тулд нэрээ оруулна уу.</p>
    <div>
      <label>Таны нэр</label>
      <input id="username-input" type="text" placeholder="жишээ: Бат" maxlength="20" autocomplete="off" />
    </div>
    <div id="login-status" class="login-status"></div>
    <button id="join-btn" onclick="joinChat()">Чатад нэгдэх</button>
  </div>
</div>

<!-- App -->
<div id="sidebar">
  <div class="sidebar-header">
    <h2>TCP Chat Server</h2>
    <div class="server-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">холбогдоогүй</span>
    </div>
  </div>
  <div class="online-section">Онлайн хэрэглэгчид</div>
  <div id="online-list"></div>
  <div class="sidebar-footer">ws://localhost:9090</div>
</div>

<div id="main">
  <div class="chat-header">
    <div class="chat-header-left">
      <h3># нийтийн чат</h3>
      <span id="online-count">0 хэрэглэгч онлайн</span>
    </div>
    <div class="msg-count" id="msg-count">0 мессеж</div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <textarea id="msg-input" placeholder="Мессеж бичнэ үү... (Enter = илгээх, Shift+Enter = шинэ мөр)" rows="1" disabled></textarea>
      <div class="typing-hint">Enter — илгээх &nbsp;·&nbsp; Shift+Enter — шинэ мөр</div>
    </div>
    <button id="send-btn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
let ws = null;
let myName = "";
let msgCount = 0;
const COLORS = ["#4f8ef7","#3fb950","#f0883e","#d29922","#bc8cff","#ff7b72","#39d353","#58a6ff"];

function colorFor(name) {
  let h = 0;
  for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return COLORS[h % COLORS.length];
}

function initials(name) {
  return name.slice(0, 2).toUpperCase();
}

function setStatus(connected) {
  document.getElementById("status-dot").className = "status-dot" + (connected ? " on" : "");
  document.getElementById("status-text").textContent = connected ? "холбогдсон" : "холбогдоогүй";
}

function showLoginStatus(msg, type) {
  const el = document.getElementById("login-status");
  el.textContent = msg;
  el.className = "login-status " + type;
}

function joinChat() {
  const name = document.getElementById("username-input").value.trim();
  if (!name) { showLoginStatus("Нэрээ оруулна уу!", "error"); return; }

  showLoginStatus("Серверт холбогдож байна...", "info");
  document.getElementById("join-btn").disabled = true;

  try {
    ws = new WebSocket("ws://localhost:9090");
  } catch(e) {
    showLoginStatus("Холболт амжилтгүй. Сервер ажиллаж байна уу?", "error");
    document.getElementById("join-btn").disabled = false;
    return;
  }

  ws.onopen = () => {
    myName = name;
    ws.send(JSON.stringify({ username: name }));
    document.getElementById("login-overlay").style.display = "none";
    document.getElementById("msg-input").disabled = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("msg-input").focus();
    setStatus(true);
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "history") {
      appendSys("─── Өмнөх чатын түүх ───");
      data.messages.forEach(renderMsg);
      appendSys("─────────────────────────");
    } else if (data.type === "online") {
      renderOnline(data.users);
    } else if (data.type === "join" || data.type === "leave") {
      appendSys(data.content);
    } else if (data.type === "message") {
      renderMsg(data);
    }
  };

  ws.onclose = () => {
    setStatus(false);
    appendSys("Серверийн холболт тасарлаа.");
    document.getElementById("msg-input").disabled = true;
    document.getElementById("send-btn").disabled = true;
  };

  ws.onerror = () => {
    showLoginStatus("Сервер олдсонгүй. python server.py ажиллуулсан уу?", "error");
    document.getElementById("join-btn").disabled = false;
    ws = null;
  };
}

function renderMsg(msg) {
  const div = document.getElementById("messages");
  const isMe = msg.sender === myName;
  const row = document.createElement("div");
  row.className = "msg-row " + (isMe ? "me" : "other");

  const color = colorFor(msg.sender);
  row.innerHTML = `
    <div class="msg-meta" style="color:${isMe ? '#4f8ef7' : color}">${msg.sender}</div>
    <div class="msg-bubble">${escHtml(msg.content)}</div>
    <div class="msg-time">${msg.timestamp}</div>
  `;
  div.appendChild(row);
  div.scrollTop = div.scrollHeight;
  msgCount++;
  document.getElementById("msg-count").textContent = msgCount + " мессеж";
}

function appendSys(text) {
  const div = document.getElementById("messages");
  const el = document.createElement("div");
  el.className = "sys-row";
  el.textContent = text;
  div.appendChild(el);
  div.scrollTop = div.scrollHeight;
}

function renderOnline(users) {
  const list = document.getElementById("online-list");
  list.innerHTML = "";
  users.forEach(u => {
    const color = colorFor(u);
    const item = document.createElement("div");
    item.className = "user-item" + (u === myName ? " me" : "");
    item.innerHTML = `
      <div class="user-avatar" style="background:${color}22;color:${color}">${initials(u)}</div>
      <span>${escHtml(u)}${u === myName ? " (та)" : ""}</span>
      <span class="online-badge">●</span>
    `;
    list.appendChild(item);
  });
  document.getElementById("online-count").textContent = users.length + " хэрэглэгч онлайн";
}

function sendMessage() {
  const input = document.getElementById("msg-input");
  const content = input.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "message", content }));
  input.value = "";
  input.style.height = "auto";
}

document.getElementById("msg-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("msg-input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});

document.getElementById("username-input").addEventListener("keydown", e => {
  if (e.key === "Enter") joinChat();
});

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}
</script>
</body>
</html>
